name: CI

# Web lint/test/build + Android debug build/unit tests on every PR and on pushes to main.
# Gates on ESLint errors (not warnings), the Vitest suite, Android unit tests,
# debug APK compilation, and any untriaged npm advisory.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails only on advisories not already triaged in scripts/audit-check.mjs
      # (deferred or accepted). A genuinely new vulnerability fails the PR.
      - name: Audit dependencies
        run: npm run audit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build


  android-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36"

      - name: Android unit tests + debug build
        working-directory: dayglance-android
        run: |
          chmod +x gradlew
          ./gradlew testGithubDebugUnitTest assembleGithubDebug --no-daemon
