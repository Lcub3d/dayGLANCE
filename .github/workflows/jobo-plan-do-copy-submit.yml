name: Prepare approved Plan Do copy
on:
  push:
    branches: [build/jobo-plan-do-labels-20260916]
permissions:
  contents: write
concurrency:
  group: jobo-plan-do-copy-submit
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'Lcub3d/dayGLANCE'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      EXPECTED: 9e92d07c8e474688eb5f3cb119a7a979d5bce6e5
    defaults:
      run:
        working-directory: project
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: feature/jobo-mobile-plan-do
          path: project
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: project/package-lock.json
      - name: Apply only the approved copy changes
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          python ../control/scripts/prepare-jobo-plan-do-copy.py
          git diff --check
          git add public/locales/*/translation.json src/components/jobo/MobileJoboView.jsx src/utils/joboMobile.copy.test.js scripts/jobo-mobile-recording-review.py docs/jobo-mobile-review.md
          git config user.name 'Lcub3d'
          git config user.email '46134215+Lcub3d@users.noreply.github.com'
          git commit -m 'fix(mobile): use Plan / Do consistently in labels and accessibility copy'
          mkdir -p review-artifacts
          git rev-parse HEAD > review-artifacts/commit.txt
          git diff "$EXPECTED" HEAD > review-artifacts/terminology.patch
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint and complete unit suite
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee review-artifacts/lint.txt
          npm test 2>&1 | tee review-artifacts/unit-tests.txt
      - name: Web and Android web builds
        run: |
          set -o pipefail
          npm run build 2>&1 | tee review-artifacts/build-web.txt
          npm run build:android 2>&1 | tee review-artifacts/build-android-web.txt
      - name: Install browser tools
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Browser interaction and terminology regression checks
        run: |
          npm run preview -- --host 127.0.0.1 --port 5173 > review-artifacts/server.txt 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5173/ >/dev/null && break || sleep 1; done
          python scripts/jobo-mobile-recording-review.py
      - name: Publish tested commit without force push
        run: |
          test "$(git ls-remote origin refs/heads/feature/jobo-mobile-plan-do | cut -f1)" = "$EXPECTED"
          git push origin HEAD:refs/heads/feature/jobo-mobile-plan-do
          git archive --format=tar.gz -o review-artifacts/source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jobo-plan-do-submission-review
          path: project/review-artifacts/
          retention-days: 30
