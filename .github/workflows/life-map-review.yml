name: Life Map review
on:
  push:
    branches: [feat/lifeplanner-life-map]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: life-map-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    if: github.repository == 'Lcub3d/dayGLANCE'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact Life Map candidate
        run: |
          set -euo pipefail
          mkdir -p review-artifacts
          git rev-parse HEAD > review-artifacts/checkout.txt
          git checkout 56c087c2cf4db5040ea5820f4fafff596870613a -- .github/workflows/life-map-review.yml
          python - <<'PY'
          import base64, lzma, hashlib
          from pathlib import Path
          encoded = ''.join(Path(f'.github/life-map-patch-{i}.b64').read_text() for i in range(3))
          patch = lzma.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == '29be4d7ccc6f6437c547b17c81f485a79b07b33ee8fface07b1d4ddeffbb4a82'
          Path('/tmp/life-map.patch').write_bytes(patch)
          fixes = Path('.github/life-map-fixes.patch')
          fixes.write_text(fixes.read_text().replace('\n diff --git ', '\ndiff --git '))
          PY
          git apply --unidiff-zero --index /tmp/life-map.patch
          git apply --index .github/life-map-fixes.patch
          git rm -f .github/life-map-patch-{0,1,2}.b64 .github/life-map-fixes.patch
          git diff --cached --check
          git write-tree > review-artifacts/tree.txt
          test "$(git write-tree)" = efdc587c125d9bce8a6d73cb3fcd3d980506565c
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Lint and full unit suite
        id: unit
        continue-on-error: true
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee review-artifacts/lint.txt
          npm test 2>&1 | tee review-artifacts/unit-tests.txt
      - name: Web and renderer builds
        run: |
          set -o pipefail
          npm run build 2>&1 | tee review-artifacts/build-web.txt
          npm run build:android 2>&1 | tee review-artifacts/build-android.txt
          npx vite build --config vite.config.electron.js --outDir dist-electron-renderer-review 2>&1 | tee review-artifacts/build-electron.txt
      - name: Browser tools
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Real application browser checks
        id: browser
        continue-on-error: true
        run: |
          set -o pipefail
          npm run preview -- --host 127.0.0.1 --port 5173 > review-artifacts/server.txt 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5173/ >/dev/null && break || sleep 1; done
          REVIEW_OUT="$GITHUB_WORKSPACE/review-artifacts/life-map" python scripts/life-map-review.py 2>&1 | tee review-artifacts/browser.txt
      - name: Publish validated source only to this feature branch
        if: steps.unit.outcome == 'success' && steps.browser.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = feat/lifeplanner-life-map
          test "$(gh api 'repos/Lcub3d/dayGLANCE/pulls?head=Lcub3d:feat%2Flifeplanner-life-map&state=closed' --jq '[.[] | select(.merged_at != null)] | length')" = 0
          git fetch origin feat/lifeplanner-life-map
          test "$(git rev-parse origin/feat/lifeplanner-life-map)" = "$GITHUB_SHA"
          git config user.name Lcub3d
          git config user.email 46134215+Lcub3d@users.noreply.github.com
          git commit -m "feat(lifeplanner): add native-data Life Map with React Flow"
          git push origin HEAD:refs/heads/feat/lifeplanner-life-map
      - name: Archive exact candidate and source
        if: always()
        run: |
          mkdir -p review-artifacts
          git rev-parse HEAD > review-artifacts/commit.txt
          git write-tree > review-artifacts/final-tree.txt
          git archive --format=tar.gz -o review-artifacts/source.tar.gz "$(git write-tree)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: life-map-review
          path: review-artifacts/
          retention-days: 14
      - name: Enforce review gates
        if: always()
        run: test '${{ steps.unit.outcome }}' = success && test '${{ steps.browser.outcome }}' = success
