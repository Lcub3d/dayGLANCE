name: Life Planner notebook review
on:
  push:
    branches: [feat/lifeplanner-notebook]
  pull_request:
    branches: [lifeplanner]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lifeplanner-notebook-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    if: github.repository == 'Lcub3d/dayGLANCE'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Record exact reviewed revision
        run: |
          mkdir -p review-artifacts
          git rev-parse HEAD > review-artifacts/commit.txt
          git rev-parse HEAD^{tree} > review-artifacts/source-tree.txt
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee review-artifacts/lint.txt
      - name: Full unit suite
        id: unit
        continue-on-error: true
        run: |
          set -o pipefail
          npm test 2>&1 | tee review-artifacts/unit-tests.txt
      - name: Web and renderer builds
        run: |
          set -o pipefail
          npm run build 2>&1 | tee review-artifacts/build-web.txt
          npm run build:android 2>&1 | tee review-artifacts/build-android.txt
          npx vite build --config vite.config.electron.js --outDir dist-electron-renderer-review 2>&1 | tee review-artifacts/build-electron.txt
      - name: Install browser tools
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Start production application
        run: |
          npm run preview -- --host 127.0.0.1 --port 5173 > review-artifacts/server.txt 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5173/ >/dev/null && break || sleep 1; done
      - name: Notebook and sticky-note browser checks
        id: notebook
        continue-on-error: true
        run: |
          set -o pipefail
          REVIEW_OUT="$GITHUB_WORKSPACE/review-artifacts/notebook" python scripts/lifeplanner-review.py 2>&1 | tee review-artifacts/notebook-browser.txt
      - name: Planning choices and cadence regressions
        id: guide
        continue-on-error: true
        run: |
          set -o pipefail
          REVIEW_OUT="$GITHUB_WORKSPACE/review-artifacts/guide" python scripts/planning-guide-review.py 2>&1 | tee review-artifacts/guide-browser.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lifeplanner-notebook-review
          path: review-artifacts/
          retention-days: 14
      - name: Enforce all review gates
        if: always()
        run: test '${{ steps.unit.outcome }}' = success && test '${{ steps.notebook.outcome }}' = success && test '${{ steps.guide.outcome }}' = success
