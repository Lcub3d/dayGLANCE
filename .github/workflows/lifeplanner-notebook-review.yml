name: Life Planner notebook review
on:
  push:
    branches: [feat/lifeplanner-notebook]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lifeplanner-notebook-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    if: github.repository == 'Lcub3d/dayGLANCE'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare source and remove one-time transport files
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p review-artifacts
          git rev-parse HEAD > review-artifacts/checkout.txt
          if test -f .github/notebook-patch-0.b64; then
            python - <<'PY'
          import base64, hashlib, lzma
          from pathlib import Path
          encoded = ''.join(Path(f'.github/notebook-patch-{i}.b64').read_text() for i in range(4))
          patch = lzma.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == '3f6e2bf8f9e63a86fb6bb258f76e2ca5300cdaa4b65d8177ff18072c1b5de409'
          Path('/tmp/notebook.patch').write_bytes(patch)
          PY
            git apply --unidiff-zero --check /tmp/notebook.patch
            git apply --unidiff-zero --index /tmp/notebook.patch
            git rm .github/notebook-patch-{0,1,2,3}.b64
            echo 'staged=true' >> "$GITHUB_OUTPUT"
          fi
          for patch in .github/notebook-fix-*.patch; do
            test -f "$patch" || continue
            git apply --index "$patch"
            git rm "$patch"
            echo 'staged=true' >> "$GITHUB_OUTPUT"
          done
          git diff --cached --check
          git write-tree > review-artifacts/candidate-tree.txt
          git diff --cached --binary > review-artifacts/candidate.patch
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee review-artifacts/lint.txt
      - name: Full unit suite
        id: unit
        continue-on-error: true
        run: |
          set -o pipefail
          npm test 2>&1 | tee review-artifacts/unit-tests.txt
      - name: Web and renderer builds
        run: |
          set -o pipefail
          npm run build 2>&1 | tee review-artifacts/build-web.txt
          npm run build:android 2>&1 | tee review-artifacts/build-android.txt
          npx vite build --config vite.config.electron.js --outDir dist-electron-renderer-review 2>&1 | tee review-artifacts/build-electron.txt
      - name: Install browser tools
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Start production application
        run: |
          npm run preview -- --host 127.0.0.1 --port 5173 > review-artifacts/server.txt 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5173/ >/dev/null && break || sleep 1; done
      - name: Notebook and sticky-note browser checks
        id: notebook
        continue-on-error: true
        run: |
          set -o pipefail
          REVIEW_OUT="$GITHUB_WORKSPACE/review-artifacts/notebook" python scripts/lifeplanner-review.py 2>&1 | tee review-artifacts/notebook-browser.txt
      - name: Planning choices and cadence regressions
        id: guide
        continue-on-error: true
        run: |
          set -o pipefail
          REVIEW_OUT="$GITHUB_WORKSPACE/review-artifacts/guide" python scripts/planning-guide-review.py 2>&1 | tee review-artifacts/guide-browser.txt
      - name: Publish validated source only to this feature branch
        if: steps.prepare.outputs.staged == 'true' && steps.unit.outcome == 'success' && steps.notebook.outcome == 'success' && steps.guide.outcome == 'success'
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = feat/lifeplanner-notebook
          git fetch origin feat/lifeplanner-notebook
          test "$(git rev-parse origin/feat/lifeplanner-notebook)" = "$GITHUB_SHA"
          git config user.name Lcub3d
          git config user.email 46134215+Lcub3d@users.noreply.github.com
          git commit -m "feat(lifeplanner): add ruled notebook, planning table and sticky-note vision editor"
          git push origin HEAD:refs/heads/feat/lifeplanner-notebook
      - name: Archive exact candidate and result
        if: always()
        run: |
          mkdir -p review-artifacts
          git rev-parse HEAD > review-artifacts/commit.txt
          git write-tree > review-artifacts/final-tree.txt
          git archive --format=tar.gz -o review-artifacts/source.tar.gz "$(git write-tree)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lifeplanner-notebook-review
          path: review-artifacts/
          retention-days: 14
      - name: Enforce all review gates
        if: always()
        run: test '${{ steps.unit.outcome }}' = success && test '${{ steps.notebook.outcome }}' = success && test '${{ steps.guide.outcome }}' = success
