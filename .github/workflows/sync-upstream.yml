name: Sync upstream main

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork main with upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api             --method POST             "/repos/${{ github.repository }}/merge-upstream"             -f branch=main
