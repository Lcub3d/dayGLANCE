name: Todoist selective sync

on:
  push:
    branches: [feature/todoist-selective-sync]

permissions:
  contents: read

concurrency:
  group: todoist-selective-sync
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive exact source and tested commit
        run: |
          git rev-parse HEAD | tee /tmp/TESTED_COMMIT.txt
          git archive --format=zip HEAD -o /tmp/dayglance-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: dayglance-source
          path: |
            /tmp/dayglance-source.zip
            /tmp/TESTED_COMMIT.txt
          retention-days: 14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Run complete test suite
        run: npm test 2>&1 | tee /tmp/dayglance-tests.log
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dayglance-web
          path: dist/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dayglance-validation
          path: |
            /tmp/TESTED_COMMIT.txt
            /tmp/dayglance-tests.log
          retention-days: 14
