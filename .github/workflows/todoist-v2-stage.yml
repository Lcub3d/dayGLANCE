name: Todoist V2 staged validation
on:
  push:
    branches: [feature/todoist-selective-sync]
    paths: [.github/workflows/todoist-v2-stage.yml]
permissions:
  contents: write
jobs:
  validate:
    if: github.repository == 'Lcub3d/dayGLANCE' && github.ref == 'refs/heads/feature/todoist-selective-sync'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply digest-pinned local implementation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --exit-code c06072f6d9d9ba6aa5b8c7d0fd05522e9548fd91 HEAD -- . ':!.github/workflows/todoist-v2-stage.yml'
          mkdir -p /tmp/todoist-v2-evidence
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess
          parts = [
            '2f77d90a1578c27644a161356dfe6ee33293983e',
            'e9ce2cdea0970b8f5cf48fb0438630842c89e2ab',
            '774ab2d6c609a5f2ba1290118ae3475ff04fd7f3',
            '7264696b85c6d6ff6765653efef8c73b3b45cdcb',
            '4517f69c7da7a5cefe58e019aeb797e0e5162c8b',
            '9137df6f2b7109bb88ad7a9c081be07ac73d2d5c',
            '7307af8c0c7e9f31516b7788a878c3077a6049b5',
            '7d2728845942e06bec746511f53c6b28e274d2c2',
            'c88dc8e65218a35225d2e5f6dd74048863b3cae5',
            '28cf8bbdcd50f9ed8c1d1bd95f1a8c4e7b74ef88',
            '3a8f4600d5d89604e45997e1e0f4e7def433b42c',
            'dc0737856fc4f250756e4233d6644897a425fe4f',
            '9bb79fe453645574467e21e66c746499d5932493',
            '0b6182f516b23a863dff15e4e3506657da484a42',
            '078076a54b93e48fd28bb70867009f5ebc60dc80',
          ]
          data = b''
          for sha in parts:
            result = json.loads(subprocess.check_output(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs/{sha}']))
            data += base64.b64decode(result['content'])
          assert len(data) == 28428
          assert hashlib.sha256(data).hexdigest() == 'b2ab0d8da433356f26b9513c842f648f3738c78862a44fd3bda3f5870beec29b'
          patch = pathlib.Path('/tmp/todoist-v2-evidence/implementation.patch')
          patch.write_bytes(gzip.decompress(data))
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply',str(patch)],check=True)
          p = pathlib.Path('src/todoist/settings.test.jsx')
          s = p.read_text()
          s = s.replace("expect(manual).not.toContain('disabled');", r"expect(manual).not.toMatch(/\sdisabled(?:=|>|\s)/);")
          s = s.replace("expect(manual).toContain('disabled');", r"expect(manual).toMatch(/\sdisabled(?:=|>|\s)/);")
          p.write_text(s)
          PY
          git diff --check
      - run: npm ci
      - name: Lint implementation
        run: npm run lint 2>&1 | tee /tmp/todoist-v2-evidence/lint.log
      - name: Full test suite
        run: npm test 2>&1 | tee /tmp/todoist-v2-evidence/tests.log
      - name: Production web build
        run: npm run build 2>&1 | tee /tmp/todoist-v2-evidence/build.log
      - name: Export exact verified source blobs (no branch writes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess
          files = ['.github/workflows/todoist-windows.yml','docs/TODOIST_SYNC_V2.md','electron-builder.todoist-windows.cjs','scripts/smoke-todoist-windows.cjs','src/App.jsx','src/components/MobileSettingsPanel.jsx','src/components/TodoistSettings.jsx','src/hooks/useTodoistSync.js','src/todoist/client.js','src/todoist/core.js','src/todoist/core.test.js','src/todoist/settings.test.jsx','src/todoist/strings.js','src/todoist/v2.test.js']
          result = []
          for name in files:
            data = pathlib.Path(name).read_bytes()
            request = json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode()
            response = json.loads(subprocess.check_output(['gh','api','--method','POST',f'repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs','--input','-'],input=request))
            expected = hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
            assert response['sha'] == expected
            result.append({'path':name,'mode':'100644','type':'blob','sha':expected})
          pathlib.Path('/tmp/todoist-v2-evidence/source-blobs.json').write_text(json.dumps(result,indent=2))
          pathlib.Path('/tmp/todoist-v2-evidence/STAGED_FROM.txt').write_text(os.environ['GITHUB_SHA'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: todoist-v2-staging-evidence
          path: /tmp/todoist-v2-evidence/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: todoist-v2-staged-web
          path: dist/
          retention-days: 14
