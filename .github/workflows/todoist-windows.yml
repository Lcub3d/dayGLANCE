name: Todoist Windows installer

on:
  push:
    branches: [feature/todoist-selective-sync]
    paths:
      - .github/workflows/todoist-windows.yml
      - electron-builder.todoist-windows.cjs
      - scripts/smoke-todoist-windows.cjs
      - 'src/todoist/**'
      - src/hooks/useTodoistSync.js
      - src/components/TodoistSettings.jsx
      - src/components/MobileSettingsPanel.jsx
      - src/App.jsx
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        type: string
        default: ''
        required: false

permissions:
  contents: read

concurrency:
  group: todoist-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    if: github.repository == 'Lcub3d/dayGLANCE' && github.ref == 'refs/heads/feature/todoist-selective-sync'
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Todoist unit and settings tests
        run: npx vitest run src/todoist
      - name: Compile Electron renderer and main process
        shell: pwsh
        run: |
          npx vite build --config vite.config.electron.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx tsc -p tsconfig.electron.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx tsc -p tsconfig.electron.preload.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package Windows x64 update installer
        run: npx electron-builder --config electron-builder.todoist-windows.cjs --win nsis --x64 --publish never
      - name: Install into disposable runner directory
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist-todoist-windows/*-Setup.exe | Select-Object -First 1
          if (-not $setup) { throw 'Installer was not produced.' }
          $dest = Join-Path $env:RUNNER_TEMP 'todoist-installed'
          $install = Start-Process -FilePath $setup.FullName -ArgumentList @('/S', "/D=$dest") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }
          $exe = Join-Path $dest 'dayGLANCE.exe'
          if (-not (Test-Path $exe)) { throw "Installed executable not found: $exe" }
          "TODOIST_TEST_EXE=$exe" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force windows-validation | Out-Null
          git rev-parse HEAD | Out-File windows-validation/TESTED_COMMIT.txt
          Get-FileHash $setup.FullName -Algorithm SHA256 | Format-List | Out-File windows-validation/SHA256.txt
          Get-AuthenticodeSignature $setup.FullName | Select-Object Status,StatusMessage | Format-List | Out-File windows-validation/SIGNATURE.txt
      - name: Install isolated smoke-test tools
        shell: pwsh
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'todoist-smoke-tools'
          npm install --prefix $tools --no-package-lock --no-audit --no-fund --ignore-scripts playwright@1.58.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "TODOIST_SMOKE_TOOLS=$tools" >> $env:GITHUB_ENV
      - name: Installed application smoke test (mock Todoist API)
        run: node scripts/smoke-todoist-windows.cjs
      - name: Upload installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dayGLANCE-Todoist-Windows-x64
          path: dist-todoist-windows/*-Setup.exe
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dayGLANCE-Todoist-Windows-validation
          path: windows-validation/
          if-no-files-found: ignore
          retention-days: 30
