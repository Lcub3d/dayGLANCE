name: Year 2 calendar review
on:
  push:
    branches: [feat/jobu-year2-chinese-calendar]
    paths: ['.github/workflows/year2-calendar-review.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  environment:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prepare exact baseline and calendar dependency
        run: |
          mkdir -p /tmp/year2-environment
          git archive 51513fbbc548a541529bd0aed308921875359b6c | gzip > /tmp/year2-environment/source.tar.gz
          npm ci --no-audit --no-fund
          npm install --save-exact lunar-javascript@1.7.7 --ignore-scripts --no-audit --no-fund
          cp package.json package-lock.json /tmp/year2-environment/
          tar -czf /tmp/year2-environment/node-modules.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: year2-calendar-environment
          path: /tmp/year2-environment/
          retention-days: 2
