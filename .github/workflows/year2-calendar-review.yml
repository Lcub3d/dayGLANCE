name: Year 2 calendar review
on:
  push:
    branches: [feat/jobu-year2-chinese-calendar]
    paths: ['.github/workflows/year2-calendar-review.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  environment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 51513fbbc548a541529bd0aed308921875359b6c
          persist-credentials: false
      - name: Archive exact baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/year2-source
          git archive HEAD | gzip > /tmp/year2-source/source.tar.gz
          git rev-parse HEAD > /tmp/year2-source/commit.txt
          git rev-parse HEAD^{tree} > /tmp/year2-source/tree.txt
          test $(stat -c%s /tmp/year2-source/source.tar.gz) -gt 1000
      - uses: actions/upload-artifact@v4
        with:
          name: year2-calendar-source
          path: /tmp/year2-source/
          retention-days: 2
